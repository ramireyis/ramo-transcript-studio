<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>RamoAltyazi — YouTube Transkript</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c2430;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:44px 20px 70px}.brand{font-weight:800;letter-spacing:-.9px;font-size:26px}.brand span{color:#3169ee}.intro{margin:64px 0 28px;text-align:center}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-1.7px;line-height:1.12;margin:0 0 14px}.sub{color:#697486;line-height:1.65}.panel{background:white;border:1px solid #e8ebf0;border-radius:22px;padding:28px;box-shadow:0 16px 40px rgba(24,44,74,.045)}label{font-size:13px;font-weight:650;display:block;margin-bottom:9px}.url{width:100%;border:1px solid #dce1e8;border-radius:12px;padding:17px;font:inherit;outline:none}.url:focus,select:focus{border-color:#3169ee;box-shadow:0 0 0 3px #3169ee18}.options{display:flex;gap:14px;margin-top:20px;align-items:end}.field{flex:1}select{width:100%;border:1px solid #dce1e8;background:#fff;border-radius:12px;padding:14px;font:inherit}.go{background:#3169ee;color:white;border:0;border-radius:12px;padding:15px 25px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}.go:disabled{opacity:.6;cursor:wait}.hint{font-size:12px;color:#8690a0;margin:15px 0 0}.result{margin-top:24px;display:none}.result.show{display:block}.resulthead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}.resulthead h2{font-size:19px;letter-spacing:-.4px;margin:0}.pill{font-size:12px;background:#eff5ff;color:#3169ee;border-radius:50px;padding:6px 10px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tool{border:1px solid #dce1e8;background:#fff;border-radius:10px;padding:10px 13px;cursor:pointer;color:#283346;font-weight:600}textarea{width:100%;height:360px;resize:vertical;border:1px solid #e2e6ec;border-radius:12px;padding:18px;font:14px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263346}.status{min-height:22px;font-size:13px;margin:14px 0 0;color:#637083}.status.error{color:#c63b3b}.footer{text-align:center;color:#a0a9b5;font-size:12px;margin-top:42px}@media(max-width:570px){.wrap{padding-top:25px}.intro{margin-top:52px}.panel{padding:19px}.options{display:block}.go{width:100%;margin-top:14px}}
</style></head><body><main class="wrap"><div class="brand">Ramo<span>Altyazi</span></div><section class="intro"><h1>YouTube videolarını<br>metne dönüştür.</h1><div class="sub">Bağlantıyı yapıştır, dili seç, transkripti al.<br>Basit, hızlı ve zahmetsiz.</div></section><section class="panel"><label for="url">YouTube video bağlantısı</label><input id="url" class="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off"><div class="options"><div class="field"><label for="lang">Transkript dili</label><select id="lang"><option value="auto">Otomatik algıla</option><option value="tr">Türkçe</option><option value="es">İspanyolca</option><option value="de">Almanca</option><option value="en">İngilizce</option></select></div><button id="go" class="go">Transkript Çıkar</button></div><p class="hint">Bağlantını ekle, gerisini RamoAltyazi halletsin.</p><p id="status" class="status" aria-live="polite"></p></section><section id="result" class="panel result"><div class="resulthead"><h2>Transkript</h2></div><div class="tools"><button class="tool" id="copy">Kopyala</button><button class="tool" id="download">TXT İndir</button><button class="tool" id="clear">Temizle</button></div><textarea id="output" spellcheck="false" aria-label="Transkript metni"></textarea></section><p class="footer">RamoAltyazi · Sade transkript stüdyosu</p></main><script>
const $=id=>document.getElementById(id);const go=$('go'),status=$('status');const setStatus=(s,bad=false)=>{status.textContent=s;status.className='status'+(bad?' error':'')};go.onclick=async()=>{const url=$('url').value.trim();if(!url){setStatus('Önce bir YouTube bağlantısı yapıştır.',true);return}go.disabled=true;go.textContent='Ücretsiz yöntemler deneniyor...';setStatus('Videonun altyazısı aranıyor, biraz sabret kankam...');try{const r=await fetch('/api/transcript',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url,lang:$('lang').value,allowSupadata:true})});const data=await r.json();if(!r.ok)throw Error(data.error||'Bağlantı kontrol edilemedi');if(!data.ok){setStatus('Bu videonun transkripti şu anda alınamadı. Biraz sonra tekrar dene.',true);return}$('output').value=data.text||'';$('result').classList.add('show');setStatus('Yine beleşe kondun amk :D Transkriptin hazır, güle güle kullan amk beleşçisi!');$('result').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){setStatus('Şu anda işlem tamamlanamadı. Lütfen tekrar dene.',true)}finally{go.disabled=false;go.textContent='Transkript Çıkar'}}; $('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);setStatus('Metin kopyalandı.')}catch{setStatus('Kopyalama başarısız; metni seçip kopyalayabilirsin.',true)}};$('download').onclick=()=>{const blob=new Blob([$('output').value],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ramoaltyazi-transkript.txt';a.click();URL.revokeObjectURL(u)};$('clear').onclick=()=>{$('output').value='';$('result').classList.remove('show');setStatus('')};$('url').addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});
</script></body></html>
